name: "Devflare Deploy"
description: "Install dependencies and deploy a Devflare project to Cloudflare, including optional preview uploads"
inputs:
  working-directory:
    description: "Directory containing the Devflare project"
    required: false
    default: "."
  environment:
    description: "Optional Devflare environment name"
    required: false
    default: ""
  preview:
    description: "When true, upload a preview version instead of deploying to production"
    required: false
    default: "false"
  preview-alias:
    description: "Explicit preview alias to use for wrangler versions upload"
    required: false
    default: ""
  branch-name:
    description: "Branch name to sanitize into a preview alias when preview-alias is not provided"
    required: false
    default: ""
  bun-version:
    description: "Bun version to install"
    required: false
    default: "1.3.6"
  install-command:
    description: "Dependency installation command to run before deploy"
    required: false
    default: "bun install --frozen-lockfile"
  install-working-directory:
    description: "Directory to run the dependency installation command from, allowing monorepo subdirectory deploys to reuse a shared root install"
    required: false
    default: ""
  deploy-command:
    description: "Optional command prefix used to invoke deploy from the target package, for example 'bun run deploy --'. When omitted, the action falls back to 'bunx devflare deploy'."
    required: false
    default: ""
  deploy-message:
    description: "Optional Wrangler --message value applied to the Worker version/deployment"
    required: false
    default: ""
  deploy-tag:
    description: "Optional Wrangler --tag value applied to the Worker version"
    required: false
    default: ""
  verify-deployment:
    description: "When true, fail if Devflare cannot verify the uploaded version or deployment in Cloudflare's control plane"
    required: false
    default: "true"
  require-fresh-production-deployment:
    description: "When true, production deploys fail if Cloudflare keeps serving the existing live deployment instead of exposing a fresh version/deployment"
    required: false
    default: "false"
  cloudflare-api-token:
    description: "Cloudflare API token passed explicitly from the caller workflow"
    required: true
  cloudflare-account-id:
    description: "Optional Cloudflare account ID passed explicitly from the caller workflow"
    required: false
    default: ""
outputs:
  preview-alias:
    description: "Resolved preview alias used for the deploy, if preview mode was enabled"
    value: ${{ steps.finalize.outputs.preview_alias }}
  preview-url:
    description: "Preview alias URL, preview URL, or deployed workers.dev URL returned by Devflare or Wrangler when available"
    value: ${{ steps.finalize.outputs.preview_url }}
  version-id:
    description: "Cloudflare Worker version ID returned by Devflare or Wrangler"
    value: ${{ steps.finalize.outputs.version_id }}
  verification-note:
    description: "Additional deployment verification context, such as when Cloudflare kept the existing active production version"
    value: ${{ steps.finalize.outputs.verification_note }}
  status:
    description: "Deployment status reported by the action: success or failure"
    value: ${{ steps.finalize.outputs.status }}
  failure-stage:
    description: "Stage where the action failed: setup, install, or deploy"
    value: ${{ steps.finalize.outputs.failure_stage }}
  exit-code:
    description: "Exit code returned by devflare deploy"
    value: ${{ steps.finalize.outputs.exit_code }}
  log-excerpt:
    description: "Tail excerpt from the deploy log for PR comments or summaries"
    value: ${{ steps.finalize.outputs.log_excerpt }}
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      id: setup
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      id: install
      if: ${{ steps.setup.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.install-working-directory != '' && inputs.install-working-directory || inputs.working-directory }}
      run: |
        set -euo pipefail

        install_log="$(mktemp)"

        set +e
        ${{ inputs.install-command }} 2>&1 | tee "$install_log"
        install_exit_code="${PIPESTATUS[0]}"
        set -e

        log_excerpt="$(tail -n 40 "$install_log" | sed $'s/\r$//')"
        log_delimiter="DEVFLARE_LOG_$(date +%s)_$$"

        echo "exit_code=$install_exit_code" >> "$GITHUB_OUTPUT"
        {
          echo "log_excerpt<<$log_delimiter"
          printf '%s\n' "$log_excerpt"
          echo "$log_delimiter"
        } >> "$GITHUB_OUTPUT"

        rm -f "$install_log"

        exit "$install_exit_code"

    - name: Deploy with Devflare
      id: deploy
      if: ${{ steps.setup.outcome == 'success' && steps.install.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_PREVIEW: ${{ inputs.preview }}
        INPUT_PREVIEW_ALIAS: ${{ inputs.preview-alias }}
        INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
        INPUT_DEPLOY_COMMAND: ${{ inputs.deploy-command }}
        INPUT_DEPLOY_MESSAGE: ${{ inputs.deploy-message }}
        INPUT_DEPLOY_TAG: ${{ inputs.deploy-tag }}
        DEVFLARE_VERIFY_DEPLOYMENT: ${{ inputs.verify-deployment }}
        DEVFLARE_REQUIRE_FRESH_PRODUCTION_DEPLOYMENT: ${{ inputs.require-fresh-production-deployment }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        WORKERS_CI_BRANCH: ${{ env.WORKERS_CI_BRANCH }}
      run: |
        set -euo pipefail

        deploy_args=()

        if [ -n "$INPUT_ENVIRONMENT" ]; then
          deploy_args+=(--env "$INPUT_ENVIRONMENT")
        fi

        if [ "$INPUT_PREVIEW" = 'true' ]; then
          deploy_args+=(--preview)

          if [ -n "$INPUT_PREVIEW_ALIAS" ]; then
            deploy_args+=(--preview-alias "$INPUT_PREVIEW_ALIAS")
          elif [ -n "$INPUT_BRANCH_NAME" ]; then
            deploy_args+=(--branch-name "$INPUT_BRANCH_NAME")
          fi
        fi

        if [ -n "$INPUT_DEPLOY_MESSAGE" ]; then
          deploy_args+=(--message "$INPUT_DEPLOY_MESSAGE")
        fi

        if [ -n "$INPUT_DEPLOY_TAG" ]; then
          deploy_args+=(--tag "$INPUT_DEPLOY_TAG")
        fi

        deploy_command="$INPUT_DEPLOY_COMMAND"
        if [ -z "$deploy_command" ]; then
          deploy_command='bunx devflare deploy'
        fi

        deploy_log="$(mktemp)"
        printf 'Using deploy command: %s\n' "$deploy_command" | tee "$deploy_log"
        printf 'Bun version: %s\n' "$(bun --version)" | tee -a "$deploy_log"
        printf 'Node version: %s\n' "$(node --version)" | tee -a "$deploy_log"
        if [ -f node_modules/vite/package.json ]; then
          printf 'Installed vite version: %s\n' "$(node -p 'require("./node_modules/vite/package.json").version')" | tee -a "$deploy_log"
        fi
        set +e
        bash -lc "$deploy_command \"\$@\"" bash "${deploy_args[@]}" 2>&1 | tee -a "$deploy_log"
        deploy_exit_code="${PIPESTATUS[0]}"
        set -e

        preview_alias="$(sed -nE 's/^.*[Pp]review [Aa]lias:?[[:space:]]+([A-Za-z0-9_-]+).*$/\1/p' "$deploy_log" | tail -n 1)"
        version_id="$(sed -nE 's/^.*(Worker )?[Vv]ersion ID:?[[:space:]]+([A-Za-z0-9_-]+).*$/\2/p' "$deploy_log" | tail -n 1)"
        preview_url="$(sed -nE 's/^.*(Preview URL|Version Preview URL|URL):[[:space:]]+(https?:\/\/[^[:space:]]+).*$/\2/p' "$deploy_log" | tail -n 1)"
        preview_alias_url="$(sed -nE 's/^.*(Preview Alias URL|Alias URL):[[:space:]]+(https?:\/\/[^[:space:]]+).*$/\2/p' "$deploy_log" | tail -n 1)"
        verification_note="$(sed -nE 's/^.*Deployment verification note:[[:space:]]+(.*)$/\1/p' "$deploy_log" | tail -n 1)"
        workers_dev_url="$(grep -oE 'https?:\/\/[^[:space:]]+' "$deploy_log" | grep 'workers.dev' | tail -n 1 || true)"
        deploy_status='success'
        if [ "$deploy_exit_code" -ne 0 ]; then
          deploy_status='failure'
        fi

        if [ -z "$preview_alias" ] && [ -n "$INPUT_PREVIEW_ALIAS" ]; then
          preview_alias="$INPUT_PREVIEW_ALIAS"
        fi

        preferred_preview_url="$preview_alias_url"
        if [ -z "$preferred_preview_url" ]; then
          preferred_preview_url="$preview_url"
        fi
        if [ -z "$preferred_preview_url" ]; then
          preferred_preview_url="$workers_dev_url"
        fi

        log_excerpt="$(tail -n 40 "$deploy_log" | sed $'s/\r$//')"
        log_delimiter="DEVFLARE_LOG_$(date +%s)_$$"
        note_delimiter="DEVFLARE_NOTE_$(date +%s)_$$"

        echo "preview_alias=$preview_alias" >> "$GITHUB_OUTPUT"
        echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
        echo "preview_url=$preferred_preview_url" >> "$GITHUB_OUTPUT"
        echo "status=$deploy_status" >> "$GITHUB_OUTPUT"
        echo "exit_code=$deploy_exit_code" >> "$GITHUB_OUTPUT"
        {
          echo "verification_note<<$note_delimiter"
          printf '%s\n' "$verification_note"
          echo "$note_delimiter"
        } >> "$GITHUB_OUTPUT"
        {
          echo "log_excerpt<<$log_delimiter"
          printf '%s\n' "$log_excerpt"
          echo "$log_delimiter"
        } >> "$GITHUB_OUTPUT"

        rm -f "$deploy_log"

        exit "$deploy_exit_code"

    - name: Finalize deploy result
      id: finalize
      if: ${{ always() }}
      shell: bash
      env:
        SETUP_OUTCOME: ${{ steps.setup.outcome }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        INSTALL_EXIT_CODE: ${{ steps.install.outputs.exit_code }}
        INSTALL_LOG_EXCERPT: ${{ steps.install.outputs.log_excerpt }}
        DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        DEPLOY_STATUS: ${{ steps.deploy.outputs.status }}
        DEPLOY_EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        DEPLOY_VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        DEPLOY_PREVIEW_ALIAS: ${{ steps.deploy.outputs.preview_alias }}
        DEPLOY_PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        DEPLOY_VERIFICATION_NOTE: ${{ steps.deploy.outputs.verification_note }}
        DEPLOY_LOG_EXCERPT: ${{ steps.deploy.outputs.log_excerpt }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_PREVIEW: ${{ inputs.preview }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        failure_stage=''
        deploy_status='success'
        exit_code=''
        version_id=''
        preview_alias=''
        preview_url=''
        verification_note=''
        log_excerpt=''

        if [ "$SETUP_OUTCOME" != 'success' ]; then
          failure_stage='setup'
          deploy_status='failure'
          log_excerpt='Bun setup failed before dependency installation or deploy could start. Inspect the "Setup Bun" logs inside the Devflare deploy action.'
        elif [ "$INSTALL_OUTCOME" != 'success' ]; then
          failure_stage='install'
          deploy_status='failure'
          exit_code="$INSTALL_EXIT_CODE"
          log_excerpt="$INSTALL_LOG_EXCERPT"

          if [ -z "$log_excerpt" ]; then
            log_excerpt='Dependency installation failed before the deploy command could start. Inspect the "Install dependencies" logs inside the Devflare deploy action.'
          fi
        else
          deploy_status="$DEPLOY_STATUS"
          if [ -z "$deploy_status" ]; then
            deploy_status='failure'
          fi

          if [ "$deploy_status" != 'success' ]; then
            failure_stage='deploy'
          fi

          exit_code="$DEPLOY_EXIT_CODE"
          version_id="$DEPLOY_VERSION_ID"
          preview_alias="$DEPLOY_PREVIEW_ALIAS"
          preview_url="$DEPLOY_PREVIEW_URL"
          verification_note="$DEPLOY_VERIFICATION_NOTE"
          log_excerpt="$DEPLOY_LOG_EXCERPT"

          if [ "$DEPLOY_OUTCOME" = 'failure' ] && [ -z "$log_excerpt" ]; then
            log_excerpt='The deploy command failed, but no log excerpt was captured. Inspect the "Deploy with Devflare" logs inside the Devflare deploy action.'
          fi
        fi

        if [ "$deploy_status" = 'success' ]; then
          failure_stage=''
        fi

        log_delimiter="DEVFLARE_LOG_$(date +%s)_$$"
        note_delimiter="DEVFLARE_NOTE_$(date +%s)_$$"

        echo "preview_alias=$preview_alias" >> "$GITHUB_OUTPUT"
        echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
        echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        echo "status=$deploy_status" >> "$GITHUB_OUTPUT"
        echo "failure_stage=$failure_stage" >> "$GITHUB_OUTPUT"
        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        {
          echo "verification_note<<$note_delimiter"
          printf '%s\n' "$verification_note"
          echo "$note_delimiter"
        } >> "$GITHUB_OUTPUT"
        {
          echo "log_excerpt<<$log_delimiter"
          printf '%s\n' "$log_excerpt"
          echo "$log_delimiter"
        } >> "$GITHUB_OUTPUT"

        {
          if [ "$deploy_status" = 'success' ]; then
            echo '### ✅ Devflare deployment succeeded'
          else
            echo '### ❌ Devflare deployment failed'
          fi
          echo ''
          echo "- Working directory: \`$INPUT_WORKING_DIRECTORY\`"
          echo "- Preview mode: \`$INPUT_PREVIEW\`"
          echo "- Status: \`$deploy_status\`"
          if [ -n "$failure_stage" ]; then
            echo "- Failure stage: \`$failure_stage\`"
          fi
          if [ -n "$exit_code" ]; then
            echo "- Exit code: \`$exit_code\`"
          fi
          if [ -n "$INPUT_ENVIRONMENT" ]; then
            echo "- Environment: \`$INPUT_ENVIRONMENT\`"
          fi
          if [ -n "$preview_alias" ]; then
            echo "- Preview alias: \`$preview_alias\`"
          fi
          if [ -n "$version_id" ]; then
            echo "- Version ID: \`$version_id\`"
          fi
          if [ -n "$verification_note" ]; then
            echo "- Verification note: $verification_note"
          fi
          if [ -n "$preview_url" ]; then
            echo "- Preview URL: $preview_url"
          fi
          if [ -n "$log_excerpt" ] && [ "$deploy_status" != 'success' ]; then
            echo ''
            echo '#### Log excerpt'
            echo ''
            echo '```text'
            printf '%s\n' "$log_excerpt"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail action when deploy did not succeed
      if: ${{ steps.finalize.outputs.status != 'success' }}
      shell: bash
      env:
        DEVFLARE_FAILURE_STAGE: ${{ steps.finalize.outputs.failure_stage }}
        DEVFLARE_EXIT_CODE: ${{ steps.finalize.outputs.exit_code }}
        DEVFLARE_LOG_EXCERPT: ${{ steps.finalize.outputs.log_excerpt }}
      run: |
        echo 'Devflare deploy action failed.' >&2

        if [ -n "$DEVFLARE_FAILURE_STAGE" ]; then
          echo "Failure stage: $DEVFLARE_FAILURE_STAGE" >&2
        fi

        if [ -n "$DEVFLARE_EXIT_CODE" ]; then
          echo "Exit code: $DEVFLARE_EXIT_CODE" >&2
        fi

        if [ -n "$DEVFLARE_LOG_EXCERPT" ]; then
          echo '' >&2
          echo 'Log excerpt:' >&2
          printf '%s\n' "$DEVFLARE_LOG_EXCERPT" >&2
        fi

        exit 1
