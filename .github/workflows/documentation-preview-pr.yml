name: Documentation PR Preview

env:
  DOCUMENTATION_PRODUCTION_URL: https://devflare-docs.refz.workers.dev

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: documentation-preview-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve documentation PR preview impact
        id: impact
        uses: ./.github/actions/devflare-deploy-impact
        with:
          target-package: documentation
          default-branch: ${{ github.event.repository.default_branch }}
          event-name: ${{ github.event_name }}
          event-action: ${{ github.event.action || '' }}
          push-before: ${{ github.event.before || '' }}
          pull-request-base-sha: ${{ github.event.pull_request.base.sha || '' }}
          pull-request-head-sha: ${{ github.event.pull_request.head.sha || '' }}

      - name: Deploy documentation PR preview
        id: deploy
        if: ${{ steps.impact.outputs.should-deploy == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/devflare-deploy
        with:
          working-directory: apps/documentation
          install-working-directory: .
          deploy-command: bun run deploy --
          preview-scope: pr-${{ github.event.pull_request.number }}
          deploy-message: Documentation PR preview ${{ github.event.pull_request.head.sha }} (run ${{ github.run_id }})
          deploy-tag: documentation-pr-preview-${{ github.run_id }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate documentation PR preview target
        id: validate-preview
        if: ${{ steps.impact.outputs.should-deploy == 'true' && steps.deploy.outputs.status == 'success' && always() }}
        continue-on-error: true
        shell: bash
        env:
          DEVFLARE_PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          DEVFLARE_EXPECTED_PREVIEW_WORKER: devflare-docs-pr-${{ github.event.pull_request.number }}
          DEVFLARE_PRODUCTION_URL: ${{ env.DOCUMENTATION_PRODUCTION_URL }}
        run: |
          set -euo pipefail

          if [ -z "$DEVFLARE_PREVIEW_URL" ]; then
            echo 'Expected documentation PR preview deployment to produce a preview URL.' >&2
            exit 1
          fi

          if [ "$DEVFLARE_PREVIEW_URL" = "$DEVFLARE_PRODUCTION_URL" ]; then
            echo "Documentation PR preview resolved to the production URL: $DEVFLARE_PREVIEW_URL" >&2
            exit 1
          fi

          if [[ "$DEVFLARE_PREVIEW_URL" != *"$DEVFLARE_EXPECTED_PREVIEW_WORKER"* ]]; then
            echo "Documentation PR preview resolved to $DEVFLARE_PREVIEW_URL, which does not contain the expected preview worker name $DEVFLARE_EXPECTED_PREVIEW_WORKER." >&2
            exit 1
          fi

      - name: Publish documentation PR preview feedback
        if: ${{ always() }}
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: comment
          operation: report
          status: ${{ steps.impact.outputs.should-deploy != 'true' && 'skipped' || (steps.deploy.outputs.status == 'success' && steps.validate-preview.outcome != 'failure' && 'success' || 'failure') }}
          title: Documentation PR preview
          comment-key: pr-deployment-status
          comment-section-key: documentation-preview
          comment-group-title: Pull request deployment status
          comment-group-summary: This single comment tracks the latest documentation and testing preview results for this pull request and is updated in place on every relevant preview workflow.
          pr-number: ${{ github.event.pull_request.number }}
          deployment-kind: preview
          ref-name: ${{ github.event.pull_request.head.ref }}
          sha: ${{ github.event.pull_request.head.sha }}
          preview-url: ${{ steps.deploy.outputs.preview-url }}
          version-id: ${{ steps.deploy.outputs.version-id }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          log-excerpt: ${{ steps.deploy.outputs.log-excerpt }}
          summary: ${{ steps.impact.outputs.should-deploy != 'true' && 'No documentation preview redeploy was needed for this run, so the existing PR-scoped preview remains in place.' || 'This pull request gets a stable PR-scoped preview link that is updated in place on every preview run.' }}
          details-markdown: |
            - Impact decision: `${{ steps.impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}`
            - Impact reason: `${{ steps.impact.outputs.reason }}`
            - Preview target verification: `${{ steps.impact.outputs.should-deploy != 'true' && 'skipped' || (steps.validate-preview.outcome == 'success' && 'passed' || 'failed') }}`
            - Final status: `${{ steps.impact.outputs.should-deploy != 'true' && 'skipped' || (steps.deploy.outputs.status == 'success' && steps.validate-preview.outcome != 'failure' && 'success' || 'failure') }}`
            - Preview strategy: named preview scope via `--preview <name>` so every pull request targets one stable dedicated preview Worker.

      - name: Summarize documentation PR preview
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### Documentation PR preview workflow'
            echo ''
            echo '- Preview strategy: named preview scope via `--preview <name>` so every pull request targets one stable dedicated preview Worker'
            echo "- Impact decision: \`${{ steps.impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}\`"
            echo "- Impact reason: ${{ steps.impact.outputs.reason }}"
            if [ "${{ steps.impact.outputs.should-deploy }}" = 'true' ]; then
              echo '- GitHub feedback: shared PR deployment comment updated in place'
              echo "- Final status: \`${{ steps.deploy.outputs.status == 'success' && steps.validate-preview.outcome != 'failure' && 'success' || (steps.deploy.outputs.status || (steps.deploy.outcome == 'success' && 'success' || 'failure')) }}\`"
            else
              echo '- GitHub feedback: skipped because no preview deployment was needed'
              echo '- Final status: `skipped`'
            fi
            echo "- PR scope: \`#${{ github.event.pull_request.number }}\`"
            echo "- Source branch: \`${{ github.event.pull_request.head.ref }}\`"
            if [ "${{ steps.validate-preview.outcome }}" = 'failure' ]; then
              echo '- Preview target verification: `failed`'
            elif [ "${{ steps.validate-preview.outcome }}" = 'success' ]; then
              echo '- Preview target verification: `passed`'
            fi
            if [ -n "${{ steps.deploy.outputs.failure-stage }}" ]; then
              echo "- Failure stage: \`${{ steps.deploy.outputs.failure-stage }}\`"
            fi
            if [ -n "${{ steps.deploy.outputs.exit-code }}" ]; then
              echo "- Exit code: \`${{ steps.deploy.outputs.exit-code }}\`"
            fi
            if [ -n "${{ steps.deploy.outputs.preview-url }}" ]; then
              echo "- Preview URL: ${{ steps.deploy.outputs.preview-url }}"
            fi
            if [ -n "${{ steps.deploy.outputs.version-id }}" ]; then
              echo "- Version ID: \`${{ steps.deploy.outputs.version-id }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when documentation PR preview deploy did not succeed
        if: ${{ steps.impact.outputs.should-deploy == 'true' && (steps.deploy.outputs.status != 'success' || steps.deploy.outcome == 'failure' || steps.validate-preview.outcome == 'failure') }}
        shell: bash
        env:
          DEVFLARE_FAILURE_STAGE: ${{ steps.deploy.outputs.failure-stage }}
          DEVFLARE_DEPLOY_EXIT_CODE: ${{ steps.deploy.outputs.exit-code }}
          DEVFLARE_DEPLOY_VERSION_ID: ${{ steps.deploy.outputs.version-id }}
          DEVFLARE_PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          DEVFLARE_DEPLOY_LOG_EXCERPT: ${{ steps.deploy.outputs.log-excerpt }}
          DEVFLARE_PREVIEW_VALIDATION_OUTCOME: ${{ steps.validate-preview.outcome }}
        run: |
          echo 'Documentation PR preview deployment failed.' >&2
          if [ "$DEVFLARE_PREVIEW_VALIDATION_OUTCOME" = 'failure' ]; then
            echo 'Preview target validation failed.' >&2
          fi
          if [ -n "$DEVFLARE_FAILURE_STAGE" ]; then
            echo "Failure stage: $DEVFLARE_FAILURE_STAGE" >&2
          fi
          if [ -n "$DEVFLARE_DEPLOY_EXIT_CODE" ]; then
            echo "Devflare exit code: $DEVFLARE_DEPLOY_EXIT_CODE" >&2
          fi
          if [ -n "$DEVFLARE_DEPLOY_VERSION_ID" ]; then
            echo "Last version ID: $DEVFLARE_DEPLOY_VERSION_ID" >&2
          fi
          if [ -n "$DEVFLARE_PREVIEW_URL" ]; then
            echo "Last preview URL: $DEVFLARE_PREVIEW_URL" >&2
          fi
          if [ -n "$DEVFLARE_DEPLOY_LOG_EXCERPT" ]; then
            echo '' >&2
            echo 'Last deploy log excerpt:' >&2
            printf '%s\n' "$DEVFLARE_DEPLOY_LOG_EXCERPT" >&2
          else
            echo 'No deploy log excerpt was captured by the deploy action.' >&2
          fi
          exit 1

  cleanup-preview:
    if: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_SCOPE: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.12-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.12-

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Clean up documentation PR preview scope
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cd apps/documentation

          bunx --bun devflare previews cleanup \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --scope "$PREVIEW_SCOPE" \
            --apply

      - name: Publish documentation PR preview cleanup feedback
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: comment
          operation: cleanup
          status: inactive
          title: Documentation PR preview
          comment-key: pr-deployment-status
          comment-section-key: documentation-preview
          comment-group-title: Pull request deployment status
          comment-group-summary: This single comment tracks the latest documentation and testing preview results for this pull request and is updated in place on every relevant preview workflow.
          pr-number: ${{ github.event.pull_request.number }}
          deployment-kind: preview
          ref-name: ${{ github.event.pull_request.head.ref }}
          summary: This pull request was closed, so Devflare deleted the PR-scoped documentation preview Worker, cleaned up preview-owned resources, and marked the shared PR deployment comment section inactive.
