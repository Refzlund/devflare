name: Testing Branch Preview Cleanup

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to clean up manually
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: read

jobs:
  cleanup-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.ref }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install shared workspace dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Resolve testing branch-scoped Worker names
        id: worker-names
        shell: bash
        run: |
          set -euo pipefail

          bun --bun -e "import { resolveTestingWorkerNames } from './apps/testing/worker-names.ts'; const names = resolveTestingWorkerNames(process.env.PREVIEW_BRANCH); console.log(\`auth_service_name=\${names.authServiceName}\`); console.log(\`search_service_name=\${names.searchServiceName}\`); console.log(\`main_worker_name=\${names.mainWorkerName}\`)" >> "$GITHUB_OUTPUT"

      - name: Retire tracked testing branch preview metadata
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAIN_WORKER_NAME: ${{ steps.worker-names.outputs.main_worker_name }}
        run: |
          set -euo pipefail

          bunx --bun devflare previews retire \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --worker "$MAIN_WORKER_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --apply

      - name: Delete branch-scoped testing Workers from Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SERVICE_NAME: ${{ steps.worker-names.outputs.auth_service_name }}
          SEARCH_SERVICE_NAME: ${{ steps.worker-names.outputs.search_service_name }}
          MAIN_WORKER_NAME: ${{ steps.worker-names.outputs.main_worker_name }}
        run: |
          set -euo pipefail

          delete_worker() {
            local worker_name="$1"
            local encoded_name
            local response_file
            local status_code

            encoded_name="$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$worker_name")"
            response_file="$(mktemp)"
            status_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$encoded_name?force=true")"

            if [ "$status_code" = '404' ]; then
              echo "Worker $worker_name was already absent."
              rm -f "$response_file"
              return 0
            fi

            if [ "${status_code#2}" != "$status_code" ]; then
              echo "Deleted Worker $worker_name"
              rm -f "$response_file"
              return 0
            fi

            echo "Deleting Worker $worker_name failed with HTTP $status_code." >&2
            cat "$response_file" >&2
            rm -f "$response_file"
            return 1
          }

          delete_worker "$MAIN_WORKER_NAME"
          delete_worker "$SEARCH_SERVICE_NAME"
          delete_worker "$AUTH_SERVICE_NAME"

      - name: Delete preview-scoped testing Cloudflare resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVFLARE_PREVIEW_BRANCH: ${{ env.PREVIEW_BRANCH }}
        run: |
          set -euo pipefail

          cd apps/testing

          bunx --bun devflare previews cleanup-resources \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --env preview \
            --apply

      - name: Mark testing branch preview deployment inactive
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: both
          operation: cleanup
          status: inactive
          title: Testing branch preview
          comment-key: testing-preview
          resolve-pr-from-ref: "true"
          deployment-kind: preview
          ref-name: ${{ env.PREVIEW_BRANCH }}
          environment: testing branch preview / ${{ env.PREVIEW_BRANCH }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: This branch was deleted, so Devflare retired the tracked testing preview metadata, deleted the branch-scoped Workers plus preview-owned Cloudflare resources, and marked the related GitHub deployment and stable PR preview comment inactive when applicable.

      - name: Summarize testing branch preview cleanup
        if: ${{ always() }}
        shell: bash
        env:
          AUTH_SERVICE_NAME: ${{ steps.worker-names.outputs.auth_service_name }}
          SEARCH_SERVICE_NAME: ${{ steps.worker-names.outputs.search_service_name }}
          MAIN_WORKER_NAME: ${{ steps.worker-names.outputs.main_worker_name }}
        run: |
          {
            echo '### Testing branch preview cleanup'
            echo ''
            echo "- Branch scope: \`$PREVIEW_BRANCH\`"
            echo '- Cleanup action: retired tracked preview metadata, deleted branch-scoped Workers and preview-owned Cloudflare resources, and marked matching GitHub deployment feedback inactive plus the stable PR preview comment when applicable'
            echo "- Main Worker: \`$MAIN_WORKER_NAME\`"
            echo "- Search service Worker: \`$SEARCH_SERVICE_NAME\`"
            echo "- Auth service Worker: \`$AUTH_SERVICE_NAME\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
