name: Testing Branch Preview Cleanup

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to clean up manually
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

jobs:
  cleanup-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.ref }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.12-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.12-

      - name: Install shared workspace dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Clean up testing branch preview scope
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cd apps/testing

          bunx --bun devflare previews cleanup \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --scope "$PREVIEW_BRANCH" \
            --apply

      - name: Mark testing branch preview deployment inactive
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: both
          operation: cleanup
          status: inactive
          title: Testing branch preview
          comment-key: testing-preview
          resolve-pr-from-ref: "true"
          deployment-kind: preview
          ref-name: ${{ env.PREVIEW_BRANCH }}
          environment: testing branch preview / ${{ env.PREVIEW_BRANCH }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: This branch was deleted, so Devflare cleaned up the branch-scoped testing preview Workers plus preview-owned Cloudflare resources and marked the related GitHub deployment and stable PR preview comment inactive when applicable.

      - name: Summarize testing branch preview cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### Testing branch preview cleanup'
            echo ''
            echo "- Branch scope: \`$PREVIEW_BRANCH\`"
            echo '- Cleanup action: deleted branch-scoped preview Workers plus preview-owned Cloudflare resources, and marked matching GitHub deployment feedback inactive plus the stable PR preview comment when applicable'
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
