name: Documentation Branch Preview Cleanup

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to retire manually
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  cleanup-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.ref }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.12-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.12-

      - name: Install shared workspace dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Clean up documentation branch preview scope
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cd apps/documentation

          bunx --bun devflare previews cleanup \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --scope "$PREVIEW_SCOPE" \
            --apply

      - name: Mark documentation branch preview deployment inactive
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: deployment
          operation: cleanup
          status: inactive
          title: Documentation branch preview
          deployment-kind: preview
          ref-name: ${{ env.PREVIEW_SCOPE }}
          environment: documentation branch preview / ${{ env.PREVIEW_SCOPE }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: This branch was deleted, so Devflare deleted the branch-scoped documentation preview Worker, cleaned up preview-owned resources, and marked the related GitHub deployment inactive.

      - name: Summarize documentation branch preview cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### Documentation branch preview cleanup'
            echo ''
            echo "- Branch scope: \`$PREVIEW_SCOPE\`"
            echo '- Cleanup action: deleted the branch-scoped preview Worker, cleaned up preview-owned resources, and marked matching GitHub deployment feedback inactive'
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
