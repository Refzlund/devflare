name: Testing Branch Preview

env:
  TESTING_EXPECTED_APP_NAME: testing-binding-matrix-preview
  TESTING_EXPECTED_DEPLOYMENT_CHANNEL: preview

on:
  push:
    paths:
      - "apps/testing/**"
      - "packages/devflare/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: testing-preview-branch-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    env:
      DEVFLARE_PREVIEW_BRANCH: "${{ github.ref_name }}"
      DEVFLARE_VERIFY_DEPLOYMENT_ATTEMPTS: "15"
      DEVFLARE_VERIFY_DEPLOYMENT_DELAY_MS: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve testing auth service deploy impact
        id: auth-impact
        uses: ./.github/actions/devflare-deploy-impact
        with:
          target-package: testing-auth-service
          default-branch: ${{ github.event.repository.default_branch }}
          event-name: ${{ github.event_name }}
          event-action: ""
          push-before: ${{ github.event.before || '' }}
          pull-request-base-sha: ""
          pull-request-head-sha: ""
          extra-paths: |
            apps/testing/worker-names.ts

      - name: Resolve testing search service deploy impact
        id: search-impact
        uses: ./.github/actions/devflare-deploy-impact
        with:
          target-package: testing-search-service
          default-branch: ${{ github.event.repository.default_branch }}
          event-name: ${{ github.event_name }}
          event-action: ""
          push-before: ${{ github.event.before || '' }}
          pull-request-base-sha: ""
          pull-request-head-sha: ""
          extra-paths: |
            apps/testing/worker-names.ts

      - name: Resolve testing main preview deploy impact
        id: main-impact
        uses: ./.github/actions/devflare-deploy-impact
        with:
          target-package: testing
          default-branch: ${{ github.event.repository.default_branch }}
          event-name: ${{ github.event_name }}
          event-action: ""
          push-before: ${{ github.event.before || '' }}
          pull-request-base-sha: ""
          pull-request-head-sha: ""

      - name: Deploy testing auth service
        id: auth
        if: ${{ steps.auth-impact.outputs.should-deploy == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/devflare-deploy
        with:
          working-directory: apps/testing/workers/auth-service
          install-working-directory: .
          preview-scope: ${{ env.DEVFLARE_PREVIEW_BRANCH }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy testing search service
        id: search
        if: ${{ steps.search-impact.outputs.should-deploy == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/devflare-deploy
        with:
          working-directory: apps/testing/workers/search-service
          install-working-directory: .
          preview-scope: ${{ env.DEVFLARE_PREVIEW_BRANCH }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy testing branch preview
        id: deploy
        if: ${{ steps.main-impact.outputs.should-deploy == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/devflare-deploy
        with:
          working-directory: apps/testing
          install-working-directory: .
          preview-scope: ${{ env.DEVFLARE_PREVIEW_BRANCH }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify testing branch preview deployed bindings
        id: verify
        if: ${{ steps.main-impact.outputs.should-deploy == 'true' && always() }}
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESTING_VERIFICATION_ATTEMPTS: "5"
          TESTING_VERIFICATION_DELAY_MS: "3000"
        run: |
          set -euo pipefail

          if [ -z "${{ steps.deploy.outputs.preview-url }}" ]; then
            echo 'Expected the deploy action to return a preview-url output for GitHub feedback.' >&2
            exit 1
          fi

          bun .github/scripts/verify-testing-preview-deployment.ts "$DEVFLARE_PREVIEW_BRANCH"

      - name: Publish testing branch preview feedback
        if: ${{ always() && (steps.auth-impact.outputs.should-deploy == 'true' || steps.search-impact.outputs.should-deploy == 'true' || steps.main-impact.outputs.should-deploy == 'true') }}
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: both
          operation: report
          status: ${{ (steps.auth-impact.outputs.should-deploy != 'true' || steps.auth.outputs.status == 'success') && (steps.search-impact.outputs.should-deploy != 'true' || steps.search.outputs.status == 'success') && (steps.main-impact.outputs.should-deploy != 'true' || (steps.deploy.outputs.status == 'success' && steps.verify.outcome == 'success')) && 'success' || 'failure' }}
          title: Testing branch preview
          comment-key: testing-preview
          resolve-pr-from-ref: "true"
          deployment-kind: preview
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          environment: testing branch preview / ${{ github.ref_name }}
          environment-url: ${{ steps.deploy.outputs.preview-url }}
          preview-url: ${{ steps.deploy.outputs.preview-url }}
          version-id: ${{ steps.deploy.outputs.version-id }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          log-excerpt: ${{ steps.deploy.outputs.log-excerpt }}
          summary: This workflow publishes a branch-scoped testing preview on every qualifying push, even when no pull request exists. When the branch belongs to an open pull request, the same run also refreshes the stable PR preview comment.
          details-markdown: |
            - Auth impact: `${{ steps.auth-impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}` (`${{ steps.auth-impact.outputs.reason }}`)
            - Auth service version: `${{ steps.auth.outputs.version-id || 'not available' }}`
            - Search impact: `${{ steps.search-impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}` (`${{ steps.search-impact.outputs.reason }}`)
            - Search service version: `${{ steps.search.outputs.version-id || 'not available' }}`
            - Main preview impact: `${{ steps.main-impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}` (`${{ steps.main-impact.outputs.reason }}`)
            - Deployed binding verification: `${{ steps.main-impact.outputs.should-deploy != 'true' && 'skipped' || (steps.verify.outcome == 'success' && 'passed' || 'failed') }}`
            - Verification mode: CI inspects the deployed preview Worker version plus the preview worker inventory because the testing preview URL is protected by Cloudflare Access.
            - Preview strategy: named preview scope via `--preview <branch>` so the testing worker family deploys to the same explicit branch target.
            - Auth deploy status: `${{ steps.auth-impact.outputs.should-deploy != 'true' && 'skipped' || steps.auth.outputs.status || (steps.auth.outcome == 'success' && 'success' || 'failure') }}`
            - Auth failure stage: `${{ steps.auth.outputs.failure-stage || 'n/a' }}`
            - Search deploy status: `${{ steps.search-impact.outputs.should-deploy != 'true' && 'skipped' || steps.search.outputs.status || (steps.search.outcome == 'success' && 'success' || 'failure') }}`
            - Search failure stage: `${{ steps.search.outputs.failure-stage || 'n/a' }}`
            - Main preview deploy status: `${{ steps.main-impact.outputs.should-deploy != 'true' && 'skipped' || steps.deploy.outputs.status || (steps.deploy.outcome == 'success' && 'success' || 'failure') }}`
            - Main preview failure stage: `${{ steps.deploy.outputs.failure-stage || 'n/a' }}`

      - name: Summarize testing branch preview
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### Testing branch preview workflow'
            echo ''
            echo '- Preview strategy: named preview scope via `--preview <branch>` so the testing worker family deploys to one explicit branch target'
            echo '- GitHub feedback: transient GitHub deployment updated on qualifying pushes, plus the stable PR comment when this branch belongs to an open pull request'
            if [ "${{ steps.auth-impact.outputs.should-deploy }}" != 'true' ] && [ "${{ steps.search-impact.outputs.should-deploy }}" != 'true' ] && [ "${{ steps.main-impact.outputs.should-deploy }}" != 'true' ]; then
              echo '- Final status: `skipped`'
              echo '- Summary: all testing deployment targets were unaffected, so the workflow kept the existing preview family as-is'
            else
              echo "- Final status: \`${{ (steps.auth-impact.outputs.should-deploy != 'true' || steps.auth.outputs.status == 'success') && (steps.search-impact.outputs.should-deploy != 'true' || steps.search.outputs.status == 'success') && (steps.main-impact.outputs.should-deploy != 'true' || (steps.deploy.outputs.status == 'success' && steps.verify.outcome == 'success')) && 'success' || 'failure' }}\`"
            fi
            echo "- Auth impact: \`${{ steps.auth-impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}\`"
            echo "- Auth impact reason: ${{ steps.auth-impact.outputs.reason }}"
            echo "- Auth deploy status: \`${{ steps.auth-impact.outputs.should-deploy != 'true' && 'skipped' || steps.auth.outputs.status || (steps.auth.outcome == 'success' && 'success' || 'failure') }}\`"
            if [ -n "${{ steps.auth.outputs.failure-stage }}" ]; then
              echo "- Auth failure stage: \`${{ steps.auth.outputs.failure-stage }}\`"
            fi
            echo "- Search impact: \`${{ steps.search-impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}\`"
            echo "- Search impact reason: ${{ steps.search-impact.outputs.reason }}"
            echo "- Search deploy status: \`${{ steps.search-impact.outputs.should-deploy != 'true' && 'skipped' || steps.search.outputs.status || (steps.search.outcome == 'success' && 'success' || 'failure') }}\`"
            if [ -n "${{ steps.search.outputs.failure-stage }}" ]; then
              echo "- Search failure stage: \`${{ steps.search.outputs.failure-stage }}\`"
            fi
            echo "- Main preview impact: \`${{ steps.main-impact.outputs.should-deploy == 'true' && 'deploy' || 'skip' }}\`"
            echo "- Main preview impact reason: ${{ steps.main-impact.outputs.reason }}"
            echo "- Main preview deploy status: \`${{ steps.main-impact.outputs.should-deploy != 'true' && 'skipped' || steps.deploy.outputs.status || (steps.deploy.outcome == 'success' && 'success' || 'failure') }}\`"
            if [ -n "${{ steps.deploy.outputs.failure-stage }}" ]; then
              echo "- Main preview failure stage: \`${{ steps.deploy.outputs.failure-stage }}\`"
            fi
            if [ -n "${{ steps.auth.outputs.version-id }}" ]; then
              echo "- Auth service version: \`${{ steps.auth.outputs.version-id }}\`"
            fi
            if [ -n "${{ steps.search.outputs.version-id }}" ]; then
              echo "- Search service version: \`${{ steps.search.outputs.version-id }}\`"
            fi
            echo "- Branch scope: \`$DEVFLARE_PREVIEW_BRANCH\`"
            if [ -n "${{ steps.deploy.outputs.preview-url }}" ]; then
              echo "- Preview URL: ${{ steps.deploy.outputs.preview-url }}"
              echo "- Verified preview config APP_NAME: \`$TESTING_EXPECTED_APP_NAME\`"
              echo "- Verified preview config DEPLOYMENT_CHANNEL: \`$TESTING_EXPECTED_DEPLOYMENT_CHANNEL\`"
            fi
            if [ -n "${{ steps.deploy.outputs.version-id }}" ]; then
              echo "- Preview version ID: \`${{ steps.deploy.outputs.version-id }}\`"
            fi
            if [ -n "${{ steps.deploy.outputs.exit-code }}" ]; then
              echo "- Main preview exit code: \`${{ steps.deploy.outputs.exit-code }}\`"
            fi
            echo "- Deployed binding verification: \`${{ steps.main-impact.outputs.should-deploy != 'true' && 'skipped' || (steps.verify.outcome == 'success' && 'passed' || 'failed') }}\`"
            echo '- Verification mode: Cloudflare API plus Wrangler inspection (the testing preview URL itself is Cloudflare Access protected)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when any testing branch preview deploy or verification step did not succeed
        if: ${{ always() && ((steps.auth-impact.outputs.should-deploy == 'true' && (steps.auth.outputs.status != 'success' || steps.auth.outcome == 'failure')) || (steps.search-impact.outputs.should-deploy == 'true' && (steps.search.outputs.status != 'success' || steps.search.outcome == 'failure')) || (steps.main-impact.outputs.should-deploy == 'true' && (steps.deploy.outputs.status != 'success' || steps.verify.outcome == 'failure' || steps.deploy.outcome == 'failure'))) }}
        shell: bash
        env:
          AUTH_STATUS: ${{ steps.auth-impact.outputs.should-deploy != 'true' && 'skipped' || steps.auth.outputs.status || (steps.auth.outcome == 'success' && 'success' || 'failure') }}
          AUTH_FAILURE_STAGE: ${{ steps.auth.outputs.failure-stage }}
          AUTH_EXIT_CODE: ${{ steps.auth.outputs.exit-code }}
          AUTH_VERSION_ID: ${{ steps.auth.outputs.version-id }}
          AUTH_LOG_EXCERPT: ${{ steps.auth.outputs.log-excerpt }}
          SEARCH_STATUS: ${{ steps.search-impact.outputs.should-deploy != 'true' && 'skipped' || steps.search.outputs.status || (steps.search.outcome == 'success' && 'success' || 'failure') }}
          SEARCH_FAILURE_STAGE: ${{ steps.search.outputs.failure-stage }}
          SEARCH_EXIT_CODE: ${{ steps.search.outputs.exit-code }}
          SEARCH_VERSION_ID: ${{ steps.search.outputs.version-id }}
          SEARCH_LOG_EXCERPT: ${{ steps.search.outputs.log-excerpt }}
          DEPLOY_STATUS: ${{ steps.main-impact.outputs.should-deploy != 'true' && 'skipped' || steps.deploy.outputs.status || (steps.deploy.outcome == 'success' && 'success' || 'failure') }}
          DEPLOY_FAILURE_STAGE: ${{ steps.deploy.outputs.failure-stage }}
          DEPLOY_EXIT_CODE: ${{ steps.deploy.outputs.exit-code }}
          DEPLOY_VERSION_ID: ${{ steps.deploy.outputs.version-id }}
          DEPLOY_PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          DEPLOY_LOG_EXCERPT: ${{ steps.deploy.outputs.log-excerpt }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          echo 'Testing branch preview deployment or deployed-binding verification failed.' >&2

          if [ "$AUTH_STATUS" != 'success' ] && [ "$AUTH_STATUS" != 'skipped' ]; then
            echo '' >&2
            echo 'Testing auth service deploy failed.' >&2
            if [ -n "$AUTH_FAILURE_STAGE" ]; then
              echo "Failure stage: $AUTH_FAILURE_STAGE" >&2
            fi
            if [ -n "$AUTH_EXIT_CODE" ]; then
              echo "Devflare exit code: $AUTH_EXIT_CODE" >&2
            fi
            if [ -n "$AUTH_VERSION_ID" ]; then
              echo "Last version ID: $AUTH_VERSION_ID" >&2
            fi
            if [ -n "$AUTH_LOG_EXCERPT" ]; then
              echo 'Last auth deploy log excerpt:' >&2
              printf '%s\n' "$AUTH_LOG_EXCERPT" >&2
            else
              echo 'No auth-service log excerpt was captured by the deploy action.' >&2
            fi
          fi

          if [ "$SEARCH_STATUS" != 'success' ] && [ "$SEARCH_STATUS" != 'skipped' ]; then
            echo '' >&2
            echo 'Testing search service deploy failed.' >&2
            if [ -n "$SEARCH_FAILURE_STAGE" ]; then
              echo "Failure stage: $SEARCH_FAILURE_STAGE" >&2
            fi
            if [ -n "$SEARCH_EXIT_CODE" ]; then
              echo "Devflare exit code: $SEARCH_EXIT_CODE" >&2
            fi
            if [ -n "$SEARCH_VERSION_ID" ]; then
              echo "Last version ID: $SEARCH_VERSION_ID" >&2
            fi
            if [ -n "$SEARCH_LOG_EXCERPT" ]; then
              echo 'Last search-service deploy log excerpt:' >&2
              printf '%s\n' "$SEARCH_LOG_EXCERPT" >&2
            else
              echo 'No search-service log excerpt was captured by the deploy action.' >&2
            fi
          fi

          if [ "$DEPLOY_STATUS" != 'success' ] && [ "$DEPLOY_STATUS" != 'skipped' ]; then
            echo '' >&2
            echo 'Testing branch preview deploy failed.' >&2
            if [ -n "$DEPLOY_FAILURE_STAGE" ]; then
              echo "Failure stage: $DEPLOY_FAILURE_STAGE" >&2
            fi
            if [ -n "$DEPLOY_EXIT_CODE" ]; then
              echo "Devflare exit code: $DEPLOY_EXIT_CODE" >&2
            fi
            if [ -n "$DEPLOY_VERSION_ID" ]; then
              echo "Last version ID: $DEPLOY_VERSION_ID" >&2
            fi
            if [ -n "$DEPLOY_PREVIEW_URL" ]; then
              echo "Last preview URL: $DEPLOY_PREVIEW_URL" >&2
            fi
            if [ -n "$DEPLOY_LOG_EXCERPT" ]; then
              echo 'Last main preview deploy log excerpt:' >&2
              printf '%s\n' "$DEPLOY_LOG_EXCERPT" >&2
            else
              echo 'No main preview log excerpt was captured by the deploy action.' >&2
            fi
          fi

          if [ "$VERIFY_OUTCOME" = 'failure' ]; then
            echo '' >&2
            echo 'Deployed binding verification failed. Inspect the "Verify testing branch preview deployed bindings" step for the Cloudflare API and Wrangler inspection diagnostics.' >&2
          fi

          exit 1
