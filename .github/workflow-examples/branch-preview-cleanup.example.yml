name: Example Branch Preview Cleanup

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to retire manually
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  cleanup-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.ref }}
      FEEDBACK_TITLE: Documentation preview
      FEEDBACK_KEY: documentation-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
		  bun-version: 1.3.12

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Clean up preview scope
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          bunx --bun devflare previews cleanup \
            --account "$CLOUDFLARE_ACCOUNT_ID" \
            --scope "$PREVIEW_BRANCH" \
            --apply

      - name: Mark GitHub deployment feedback inactive
        uses: ./.github/actions/devflare-github-feedback
        with:
          github-token: ${{ github.token }}
          mode: deployment
          operation: cleanup
          status: inactive
          title: ${{ env.FEEDBACK_TITLE }}
          comment-key: ${{ env.FEEDBACK_KEY }}
          deployment-kind: preview
          ref-name: ${{ env.PREVIEW_BRANCH }}
          environment: documentation preview / ${{ env.PREVIEW_BRANCH }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: The branch was deleted, so Devflare cleaned up the preview scope and marked the related GitHub deployment inactive.
